[package]
name = "oxide-shell"
version = "0.1.0"
edition = "2021"
authors = ["OxideShell Architect <architect@oxideshell.internal>"]
description = "Ultra-Low-RAM Native Rust macOS Desktop Environment for Windows"

[lib]
name = "oxide_shell"
path = "src/lib.rs"

[[bin]]
name = "oxide_shell"
path = "src/main.rs"

[dependencies]
winit = { version = "0.29", default-features = false, features = ["rwh_06"] }
softbuffer = "=0.4.6"
tiny-skia = "0.11"
fontdue = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
raw-window-handle = "0.6"

[dependencies.windows-sys]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Security",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
